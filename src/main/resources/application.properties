# --- API context path (Step 1.6 / X1) ---
# Every REST route is served under /api so a single ALB hostname can route /api/*
# to this backend and /*  to the frontend. The management port (8081, actuator) is
# configured separately below and does NOT inherit this context-path in Spring Boot.
server.servlet.context-path=/api

spring.datasource.url=jdbc:sqlite:dev.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jackson.deserialization.UNWRAP_ROOT_VALUE=true

image.default=https://static.productionready.io/images/smiley-cyrus.jpg

jwt.secret=${JWT_SECRET}
jwt.sessionTime=86400

mybatis.configuration.cache-enabled=true
mybatis.configuration.default-statement-timeout=3000
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.use-generated-keys=true
mybatis.type-handlers-package=io.spring.infrastructure.mybatis
mybatis.mapper-locations=mapper/*.xml

logging.level.io.spring.infrastructure.mybatis.readservice.ArticleReadService=DEBUG
logging.level.io.spring.infrastructure.mybatis.mapper=DEBUG

# --- Actuator (Step 1.4 / B10) ---
# Management endpoints are served on a separate port from app traffic (8080) so that
# /actuator/** is unreachable through whatever will later route only the traffic port
# (an ALB in production). Only health, info, and prometheus are exposed; everything else
# (env, heapdump, configprops, etc.) stays off by default.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# By default Boot's readiness group only reflects ReadinessState, not arbitrary indicators
# like the datasource. Add "db" explicitly so readiness genuinely reflects DB health, while
# leaving liveness at its default (readinessState/livenessState only, no db) so a transient
# DB blip cannot be mistaken for a liveness failure that would get the pod killed/restarted.
management.endpoint.health.group.readiness.include=readinessState,db
# step 9.4: dev and prod share one prometheus instance (step 8.6) - without this every metric
# from both backends is otherwise indistinguishable beyond the namespace/pod labels prometheus
# itself adds at scrape time.
management.metrics.tags.application=realworld-backend
# micrometer doesn't publish percentile histogram buckets by default (confirmed live - zero
# http_server_requests_seconds_bucket series without this) - histogram_quantile() in PromQL
# needs them. scoped to this one timer only, not enabled globally, to keep the bucket-count
# cardinality cost contained (the uri label is already bounded - Spring's default WebMvcTagsProvider
# uses the matched route pattern like /articles/{slug}, confirmed live, not the raw request path).
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Graceful shutdown (B23) ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
