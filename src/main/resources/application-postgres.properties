spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# step 8.7 rollback drill: deliberately broken, dev only - readiness never reports up,
# so the deployment never passes its probe. request-time only (evaluated when
# /actuator/health/readiness is actually hit), unlike server.port which turned out to
# get bound eagerly at context-refresh regardless of web-application-type - verified
# locally that this does NOT affect the migrate job (web-application-type=none, no
# readiness probe configured on the job, nothing ever calls this endpoint)
management.endpoint.health.group.readiness.include=nonexistentIndicator
