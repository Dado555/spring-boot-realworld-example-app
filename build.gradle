plugins {
    id 'org.springframework.boot' version '2.6.3'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'java'
    id "com.netflix.dgs.codegen" version "5.0.6"
    id "com.diffplug.spotless" version "6.2.1"
}

version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'
targetCompatibility = '11'

spotless {
    java {
        target project.fileTree(project.rootDir) {
            include '**/*.java'
            exclude 'build/generated/**/*.*', 'build/generated-examples/**/*.*'
        }
        googleJavaFormat()
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// Step 1.7 / B16: Testcontainers is NOT part of Spring Boot 2.6.3's dependency-management
// BOM (verified: no testcontainers entries in spring-boot-dependencies-2.6.3.pom), so pin a
// version explicitly rather than relying on a managed one that doesn't exist here. 1.16.3 is
// the release contemporaneous with Boot 2.6.3 (both Jan 2022), targets JUnit 5 (this project
// already uses useJUnitPlatform()) and Java 8+, so it runs fine on the JDK 11 toolchain this
// build uses. Importing testcontainers-bom (rather than pinning each artifact) keeps the
// postgresql/junit-jupiter/docker-java transitive versions mutually consistent.
dependencyManagement {
    imports {
        mavenBom 'org.testcontainers:testcontainers-bom:1.16.3'
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Actuator: exposes health/info/prometheus on a separate management port (see
    // application.properties) so Kubernetes liveness/readiness probes and Prometheus
    // scraping work without going through the app's traffic port or its security filter chain.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Prometheus registry for the /actuator/prometheus scrape endpoint. runtimeOnly: only
    // auto-configuration touches these classes, nothing in our code references them directly.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:2.2.2'
    implementation 'com.netflix.graphql.dgs:graphql-dgs-spring-boot-starter:4.9.21'
    implementation 'org.flywaydb:flyway-core'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.2'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.2',
                'io.jsonwebtoken:jjwt-jackson:0.11.2'
    implementation 'joda-time:joda-time:2.10.13'
    implementation 'org.xerial:sqlite-jdbc:3.36.0.3'
    // step 9.2: json console encoder for logback-spring.xml. 6.6 is the last
    // 6.x release - built/tested against logback 1.2.3, this project resolves
    // 1.2.10 (spring boot 2.6.3's managed version), same minor line so binary
    // compatible. 7.0+ requires logback 1.3+, not this project's version.
    implementation 'net.logstash.logback:logstash-logback-encoder:6.6'
    // Postgres driver for the optional `postgres` Spring profile (see application-postgres.properties).
    // runtimeOnly (not implementation): must not leak onto the compile classpath; the default
    // profile still uses SQLite, this only makes Postgres a possible target.
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'io.rest-assured:rest-assured:4.5.1'
    testImplementation 'io.rest-assured:json-path:4.5.1'
    testImplementation 'io.rest-assured:xml-path:4.5.1'
    testImplementation 'io.rest-assured:spring-mock-mvc:4.5.1'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:2.2.2'
    // Testcontainers (Step 1.7 / B16): version pinned via testcontainers-bom above.
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('test') {
	useJUnitPlatform()
	// The Testcontainers Postgres suite lives in its own "integrationTest" task (below)
	// because it needs Docker; keep it out of the fast, Docker-free unit suite.
	exclude '**/PostgresIntegrationTest.class'
}

// Step 1.7 / B16: separate task for the Testcontainers PostgreSQL integration coverage so
// `./gradlew test` (fast suite, no Docker required) stays fast and CI-friendly, while
// `./gradlew integrationTest` opts in to the slower, Docker-dependent real-Postgres run.
// Reuses the existing test sourceSet/classpath rather than a new SourceSet, since it's a
// single extra test class, not a parallel tree of sources.
task integrationTest(type: Test) {
	description = 'Runs the Testcontainers PostgreSQL integration test (requires local Docker).'
	group = 'verification'
	useJUnitPlatform()
	include '**/PostgresIntegrationTest.class'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	shouldRunAfter test
}

tasks.named('clean') {
    doFirst {
        delete './dev.db'
    }
}

tasks.named('generateJava') {
    schemaPaths = ["${projectDir}/src/main/resources/schema"] // List of directories containing schema files
    packageName = 'io.spring.graphql' // The package name to use to generate sources
}
