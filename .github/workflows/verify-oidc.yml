name: verify-aws-keys

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credentials from secrets
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: who am i
        run: aws sts get-caller-identity

      - name: ecr describe-repositories should succeed
        run: aws ecr describe-repositories --repository-names realworld-backend --region us-east-1

      - name: ec2 describe-instances should FAIL - this is the real test
        run: |
          if aws ec2 describe-instances --region us-east-1; then
            echo "ERROR: ec2 describe-instances succeeded but should have been denied - the user is too broad"
            exit 1
          else
            echo "Correctly denied - user is properly scoped"
          fi
