name: verify-oidc

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: configure aws credentials via oidc
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::262786914511:role/gha-backend-ecr-push
          aws-region: us-east-1

      - name: who am i
        run: aws sts get-caller-identity

      - name: ecr describe-repositories should succeed
        run: aws ecr describe-repositories --repository-names realworld-backend --region us-east-1

      - name: ec2 describe-instances should FAIL - this is the real test
        run: |
          if aws ec2 describe-instances --region us-east-1; then
            echo "ERROR: ec2 describe-instances succeeded but should have been denied - the role is too broad"
            exit 1
          else
            echo "Correctly denied - role is properly scoped"
          fi
