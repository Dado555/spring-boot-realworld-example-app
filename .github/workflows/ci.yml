name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up jdk 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"

      - name: cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # cheapest and most likely to fail first
      - name: spotless check
        run: ./gradlew spotlessCheck --no-daemon

      - name: unit tests
        run: ./gradlew test --no-daemon

      # testcontainers needs docker, which ubuntu-latest runners already have
      - name: integration tests
        run: ./gradlew integrationTest --no-daemon

      - name: build jar
        run: ./gradlew bootJar --no-daemon

      - name: short sha
        id: sha
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: docker build
        run: docker build -t realworld-backend:${{ steps.sha.outputs.value }} .

      # accepted-risk CRITICAL cves (EOL spring boot 2.6.3 chain) are listed in
      # .trivyignore, each with a review date - see docs/security/image-scanning.md
      # (infra repo) for the decision. everything else CRITICAL-with-a-fix still
      # gates the build; HIGH and unfixed findings are visibility-only, not a gate.
      - name: trivy scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore \
            realworld-backend:${{ steps.sha.outputs.value }}

      # everything above runs on every PR too. nothing below this line runs
      # anywhere except a real push to master - no AWS credentials are ever
      # loaded for a PR-triggered run, fork or otherwise.
      - name: configure aws credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: login to ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push to ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag realworld-backend:${{ steps.sha.outputs.value }} \
            ${{ steps.ecr.outputs.registry }}/realworld-backend:${{ steps.sha.outputs.value }}
          docker push ${{ steps.ecr.outputs.registry }}/realworld-backend:${{ steps.sha.outputs.value }}

      # ecr's own record of the digest, not parsed from docker cli output -
      # unambiguous and doesn't depend on any particular docker version's format.
      # validated below since `--output text` on a null/missing result prints the
      # literal string "None" instead of failing - would otherwise flow straight
      # into gitops as a broken digest with nothing downstream to catch it
      # (validate.yml only runs on pull_request, never on this push)
      - name: get image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: digest
        run: |
          digest=$(aws ecr describe-images \
            --repository-name realworld-backend \
            --image-ids imageTag=${{ steps.sha.outputs.value }} \
            --query 'imageDetails[0].imageDigest' --output text)
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ecr returned an invalid digest for tag ${{ steps.sha.outputs.value }}: '$digest'"
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      # short-lived token scoped only to the gitops repo, minted fresh every run -
      # no long-lived pat in secrets, matches adr 0009's oidc-blocked fallback reasoning
      - name: mint gitops app token
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: gitops-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: Dado555
          repositories: gitops-realworld-example-app

      - name: checkout gitops repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/checkout@v7.0.1
        with:
          repository: Dado555/gitops-realworld-example-app
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      # keeps both files in sync - envs/dev/backend-values.yaml (reference, what
      # step 8.4's validate.yml checks) and the argo application's own inline
      # valuesObject (what argo actually deploys - see apps/realworld-backend-dev.yaml)
      - name: update gitops dev values
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          for f in gitops/envs/dev/backend-values.yaml gitops/apps/realworld-backend-dev.yaml; do
            sed -i "s|tag: \"[^\"]*\"|tag: \"${{ steps.sha.outputs.value }}\"|" "$f"
            sed -i "s|digest: \"sha256:[a-f0-9]*\"|digest: \"${{ steps.digest.outputs.value }}\"|" "$f"
            # sed exits 0 even on zero matches - confirm the edit actually landed
            # rather than trusting the exit code alone
            if ! grep -qF "tag: \"${{ steps.sha.outputs.value }}\"" "$f" || ! grep -qF "digest: \"${{ steps.digest.outputs.value }}\"" "$f"; then
              echo "::error::sed did not update $f as expected - has its format changed?"
              exit 1
            fi
          done

      # [skip ci] is defense in depth - gitops's own validate.yml only triggers on
      # pull_request today, not push, so there's no loop yet, but this guards
      # against one if a future step adds a push-triggered gitops workflow
      - name: commit and push gitops update
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: promote
        working-directory: gitops
        run: |
          git config user.name "promoter-realworld-example-app[bot]"
          git config user.email "322261227+promoter-realworld-example-app[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "no image change, nothing to promote"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          git add envs/dev/backend-values.yaml apps/realworld-backend-dev.yaml
          git commit -m "chore: promote realworld-backend to ${{ steps.sha.outputs.value }} [skip ci]

          source: spring-boot-realworld-example-app@${{ github.sha }}"

          # the frontend repo's own promotion can race this same push (both
          # target gitops main independently, no shared concurrency group across
          # repos) - retry on a non-fast-forward rejection rather than failing
          # outright, since a rebase here is safe: each app only ever touches its
          # own two files, so there's nothing for the two promotions to conflict on
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5), fetching and rebasing"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::failed to push to gitops main after 5 attempts"
          exit 1

      # opens (never merges) a pr against envs/prod/ - codeowners (step 8.4) gates
      # the actual promotion on review, so prod stays on its current image until
      # someone merges this. a fresh branch per promotion, not reused - simpler
      # than deduplicating against a possibly-already-merged-or-closed prior pr,
      # at the cost of possible pr pileup if several dev promotions land before
      # anyone reviews one (acceptable for this project's promotion frequency)
      - name: open prod promotion pr
        if: steps.promote.outputs.promoted == 'true'
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
        run: |
          BRANCH="promote-prod-backend-${{ steps.sha.outputs.value }}"
          git checkout -b "$BRANCH"
          sed -i "s|tag: \"[^\"]*\"|tag: \"${{ steps.sha.outputs.value }}\"|" envs/prod/backend-values.yaml apps/realworld-backend-prod.yaml
          sed -i "s|digest: \"sha256:[a-f0-9]*\"|digest: \"${{ steps.digest.outputs.value }}\"|" envs/prod/backend-values.yaml apps/realworld-backend-prod.yaml
          if ! grep -qF "tag: \"${{ steps.sha.outputs.value }}\"" envs/prod/backend-values.yaml || ! grep -qF "tag: \"${{ steps.sha.outputs.value }}\"" apps/realworld-backend-prod.yaml; then
            echo "::error::sed did not update the prod files as expected"
            exit 1
          fi
          git add envs/prod/backend-values.yaml apps/realworld-backend-prod.yaml
          git commit -m "chore: promote realworld-backend to ${{ steps.sha.outputs.value }} (prod)

          source: spring-boot-realworld-example-app@${{ github.sha }}"
          git push origin "$BRANCH"
          gh pr create \
            --repo Dado555/gitops-realworld-example-app \
            --base main \
            --head "$BRANCH" \
            --title "chore: promote realworld-backend to ${{ steps.sha.outputs.value }} (prod)" \
            --body "Promotes \`realworld-backend\` to prod.

          - Source: spring-boot-realworld-example-app@${{ github.sha }}
          - Tag: \`${{ steps.sha.outputs.value }}\`
          - Digest: \`${{ steps.digest.outputs.value }}\`
          - Already live in dev as of this same run.

          Merging this is the actual production deploy - Argo syncs on merge, not before."
